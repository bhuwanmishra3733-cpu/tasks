          // ---------- Data ----------

          @Immutable
          data class NoteImage(
              val file: String,
              val caption: String = ""
          )

          @Immutable
          data class TaskItem(
              val id: Long,
              val title: String,
              val page: String,
              val done: Boolean = false,
              val pinned: Boolean = false,
              val note: String = "",
              val images: List<NoteImage> = emptyList()
          )

          @Stable
          class AppState(prefs: SharedPreferences, val imageDir: File, defaultDark: Boolean) {
              var tasks by mutableStateOf(loadTasks(prefs.getString("tasks", "[]") ?: "[]"))
              var pages by mutableStateOf(loadPages(prefs.getString("pages", "[\"My Tasks\"]") ?: "[\"My Tasks\"]"))
              var dark by mutableStateOf(prefs.getBoolean("dark", defaultDark))

              private fun updateTask(id: Long, change: (TaskItem) -> TaskItem) {
                  tasks = tasks.map { if (it.id == id) change(it) else it }
              }

              private fun deleteFilesOf(list: List<TaskItem>) {
                  list.forEach { t -> t.images.forEach { ImageStore.delete(imageDir, it.file) } }
              }

              fun add(title: String, page: String) {
                  val t = title.trim()
                  if (t.isEmpty()) return
                  val id = maxOf(System.currentTimeMillis(), (tasks.maxOfOrNull { it.id } ?: 0L) + 1L)
                  tasks = tasks + TaskItem(id = id, title = t, page = page)
              }

              fun toggle(id: Long) = updateTask(id) { it.copy(done = !it.done) }

              fun pin(id: Long) = updateTask(id) { it.copy(pinned = !it.pinned) }

              fun setNote(id: Long, note: String) = updateTask(id) { it.copy(note = note) }

              fun addImage(id: Long, file: String) =
                  updateTask(id) { it.copy(images = it.images + NoteImage(file)) }

              fun removeImage(id: Long, file: String) {
                  updateTask(id) { t -> t.copy(images = t.images.filterNot { it.file == file }) }
                  ImageStore.delete(imageDir, file)
              }

              fun setCaption(id: Long, file: String, caption: String) =
                  updateTask(id) { t ->
                      t.copy(images = t.images.map { if (it.file == file) it.copy(caption = caption) else it })
                  }

              fun replaceImage(id: Long, oldFile: String, newFile: String) {
                  updateTask(id) { t ->
                      t.copy(images = t.images.map { if (it.file == oldFile) it.copy(file = newFile) else it })
                  }
                  ImageStore.delete(imageDir, oldFile)
              }

              fun delete(id: Long) {
                  deleteFilesOf(tasks.filter { it.id == id })
                  tasks = tasks.filterNot { it.id == id }
              }

              fun clearDone(page: String) {
                  deleteFilesOf(tasks.filter { it.done && it.page == page })
                  tasks = tasks.filterNot { it.done && it.page == page }
              }

              fun addPage(name: String): String? {
                  val p = name.trim()
                  if (p.isEmpty() || pages.contains(p)) return null
                  pages = pages + p
                  return p
              }

              fun renamePage(old: String, newName: String): Boolean {
                  val n = newName.trim()
                  if (n.isEmpty()) return false
                  if (n == old) return true
                  if (pages.contains(n)) return false
                  pages = pages.map { if (it == old) n else it }
                  tasks = tasks.map { if (it.page == old) it.copy(page = n) else it }
                  return true
              }

              fun deletePage(name: String) {
                  if (pages.size <= 1) return
                  deleteFilesOf(tasks.filter { it.page == name })
                  tasks = tasks.filterNot { it.page == name }
                  pages = pages.filterNot { it == name }
              }
          }

          // ---------- Image storage ----------

          private object ImageStore {
              const val MAX_DIM = 1600

              fun delete(dir: File, name: String) {
                  try {
                      File(dir, name).delete()
                  } catch (_: Exception) {
                  }
              }

              private fun sample(w: Int, h: Int, maxDim: Int): Int {
                  var s = 1
                  while (maxOf(w, h) / (s * 2) >= maxDim) s *= 2
                  return s
              }

              fun loadBitmap(file: File, maxDim: Int): Bitmap? {
                  return try {
                      if (!file.exists()) {
                          null
                      } else {
                          val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          BitmapFactory.decodeFile(file.path, bounds)
                          val opts = BitmapFactory.Options().apply {
                              inSampleSize = sample(bounds.outWidth, bounds.outHeight, maxDim)
                          }
                          BitmapFactory.decodeFile(file.path, opts)
                      }
                  } catch (_: Throwable) {
                      null
                  }
              }

              @Suppress("NewApi")
              private fun readRotation(context: Context, uri: Uri): Int {
                  if (Build.VERSION.SDK_INT < 24) return 0
                  return try {
                      context.contentResolver.openInputStream(uri)?.use { s ->
                          when (ExifInterface(s).getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL)) {
                              ExifInterface.ORIENTATION_ROTATE_90 -> 90
                              ExifInterface.ORIENTATION_ROTATE_180 -> 180
                              ExifInterface.ORIENTATION_ROTATE_270 -> 270
                              else -> 0
                          }
                      } ?: 0
                  } catch (_: Throwable) {
                      0
                  }
              }

              fun importFromUri(context: Context, uri: Uri, dir: File): String? {
                  try {
                      val resolver = context.contentResolver
                      val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      resolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                      if (bounds.outWidth <= 0 || bounds.outHeight <= 0) return null
                      val opts = BitmapFactory.Options().apply {
                          inSampleSize = sample(bounds.outWidth, bounds.outHeight, MAX_DIM)
                      }
                      val decoded = resolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) }
                          ?: return null
                      var work: Bitmap = decoded
                      val rotation = readRotation(context, uri)
                      if (rotation != 0) {
                          val m = Matrix()
                          m.postRotate(rotation.toFloat())
                          work = Bitmap.createBitmap(work, 0, 0, work.width, work.height, m, true)
                      }
                      val longest = maxOf(work.width, work.height)
                      if (longest > MAX_DIM) {
                          val f = MAX_DIM.toFloat() / longest
                          work = Bitmap.createScaledBitmap(
                              work,
                              (work.width * f).toInt().coerceAtLeast(1),
                              (work.height * f).toInt().coerceAtLeast(1),
                              true
                          )
                      }
                      dir.mkdirs()
                      val name = "img_" + UUID.randomUUID().toString() + ".jpg"
                      val finalBitmap = work
                      File(dir, name).outputStream().use { out ->
                          finalBitmap.compress(Bitmap.CompressFormat.JPEG, 88, out)
                      }
                      return name
                  } catch (_: Throwable) {
                      return null
                  }
              }

              fun saveWithStrokes(
                  source: File,
                  dir: File,
                  strokes: List<Pair<Int, List<Offset>>>,
                  widthFraction: Float
              ): String? {
                  try {
                      val base = loadBitmap(source, MAX_DIM) ?: return null
                      val copy = base.copy(Bitmap.Config.ARGB_8888, true) ?: return null
                      val canvas = android.graphics.Canvas(copy)
                      val w = copy.width.toFloat()
                      val h = copy.height.toFloat()
                      val paint = android.graphics.Paint()
                      paint.isAntiAlias = true
                      paint.strokeCap = android.graphics.Paint.Cap.ROUND
                      paint.strokeJoin = android.graphics.Paint.Join.ROUND
                      paint.strokeWidth = widthFraction * w
                      for (stroke in strokes) {
                          val argb = stroke.first
                          val pts = stroke.second
                          if (pts.isEmpty()) continue
                          paint.color = argb
                          if (pts.size == 1) {
                              paint.style = android.graphics.Paint.Style.FILL
                              canvas.drawCircle(pts[0].x * w, pts[0].y * h, widthFraction * w / 2f, paint)
                          } else {
                              paint.style = android.graphics.Paint.Style.STROKE
                              val path = android.graphics.Path()
                              path.moveTo(pts[0].x * w, pts[0].y * h)
                              for (i in 1 until pts.size) {
                                  path.lineTo(pts[i].x * w, pts[i].y * h)
                              }
                              canvas.drawPath(path, paint)
                          }
                      }
                      dir.mkdirs()
                      val name = "img_" + UUID.randomUUID().toString() + ".jpg"
                      File(dir, name).outputStream().use { out ->
                          copy.compress(Bitmap.CompressFormat.JPEG, 90, out)
                      }
                      return name
                  } catch (_: Throwable) {
                      return null
                  }
              }
          }

