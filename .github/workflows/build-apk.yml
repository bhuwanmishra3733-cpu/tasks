          private fun greeting(): String {
              val h = java.util.Calendar.getInstance().get(java.util.Calendar.HOUR_OF_DAY)
              return when {
                  h < 5 -> "Burning the midnight oil 🌙"
                  h < 12 -> "Good morning ☀️"
                  h < 17 -> "Good afternoon 🌤️"
                  h < 21 -> "Good evening 🌆"
