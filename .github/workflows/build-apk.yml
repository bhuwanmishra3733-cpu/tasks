          @Composable
          private fun TaskManagerApp() {
              val context = LocalContext.current
              val systemDark = isSystemInDarkTheme()
              val prefs = remember { context.getSharedPreferences("task_manager", 0) }
              val imageDir = remember { File(context.filesDir, "notes").apply { mkdirs() } }
              val state = remember { AppState(prefs, imageDir, systemDark) }
              var showSplash by rememberSaveable { mutableStateOf(true) }

              LaunchedEffect(Unit) {
                  delay(1200)
                  showSplash = false
              }

              // Save to disk in the background, only after changes settle (keeps the UI smooth).
              LaunchedEffect(Unit) {
                  snapshotFlow { Triple(state.tasks, state.pages, state.dark) }
                      .collectLatest { (t, p, d) ->
                          delay(150)
                          withContext(Dispatchers.IO) {
                              prefs.edit()
                                  .putString("tasks", tasksToJson(t))
                                  .putString("pages", pagesToJson(p))
                                  .putBoolean("dark", d)
                                  .apply()
                          }
                      }
              }

              // Keep the system bar icons readable in both themes.
              LaunchedEffect(state.dark) {
                  (context as? ComponentActivity)?.enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT),
                      navigationBarStyle = if (state.dark) {
                          SystemBarStyle.dark(android.graphics.Color.TRANSPARENT)
                      } else {
                          SystemBarStyle.light(android.graphics.Color.TRANSPARENT, android.graphics.Color.TRANSPARENT)
                      }
                  )
              }

              MaterialTheme(colorScheme = if (state.dark) DarkColors else LightColors) {
                  Crossfade(targetState = showSplash, label = "splash") { isSplash ->
                      if (isSplash) SplashScreen(state.dark) else TaskScreen(state)
                  }
              }
          }

          // ---------- Splash ----------

          @Composable
          private fun SplashScreen(dark: Boolean) {
              var go by remember { mutableStateOf(false) }
              LaunchedEffect(Unit) { go = true }
              val s by animateFloatAsState(targetValue = if (go) 1f else 0.85f, label = "splashScale")
              val a by animateFloatAsState(targetValue = if (go) 1f else 0f, label = "splashAlpha")
              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(if (dark) Color.Black else Color.White),
                  contentAlignment = Alignment.Center
              ) {
                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      modifier = Modifier
                          .scale(s)
                          .alpha(a)
                  ) {
                      Canvas(modifier = Modifier.size(120.dp)) {
                          val r = size.width * 0.28f
                          drawRoundRect(color = Color(0xFF5B4BDB), cornerRadius = CornerRadius(r, r))
                          val k = size.width / 108f
                          val p = Path()
                          p.moveTo(30f * k, 56f * k)
                          p.lineTo(46f * k, 72f * k)
                          p.lineTo(78f * k, 36f * k)
                          drawPath(
                              path = p,
                              color = Color.White,
                              style = Stroke(width = 11f * k, cap = StrokeCap.Round, join = StrokeJoin.Round)
                          )
                      }
                      Spacer(Modifier.height(20.dp))
                      Text(
                          text = "Task Manager by Bhuvan",
                          color = if (dark) Color(0xFF9C8CFF) else Color(0xFF5B4BDB),
                          fontWeight = FontWeight.Medium,
                          fontSize = 16.sp
                      )
                  }
              }
          }

          // ---------- Screen ----------

          @Composable
          private fun TaskScreen(state: AppState) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val cs = MaterialTheme.colorScheme
              var selectedPage by rememberSaveable { mutableStateOf(state.pages.first()) }
              var showPending by rememberSaveable { mutableStateOf(false) }
              var search by rememberSaveable { mutableStateOf("") }
              var showSearch by rememberSaveable { mutableStateOf(false) }
              var expandedId by rememberSaveable { mutableStateOf(-1L) }
              var pendingImageTask by rememberSaveable { mutableStateOf(-1L) }
              var showAddPage by remember { mutableStateOf(false) }
              var menuPage by remember { mutableStateOf<String?>(null) }
              var renameTarget by remember { mutableStateOf<String?>(null) }
              var deleteTarget by remember { mutableStateOf<String?>(null) }
              var editing by remember { mutableStateOf<Pair<Long, String>?>(null) }
              val haptic = LocalHapticFeedback.current
              val greet = remember { greeting() }

              val currentPage = if (state.pages.contains(selectedPage)) selectedPage else state.pages.first()

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  val id = pendingImageTask
                  if (uri != null && id != -1L) {
                      scope.launch {
                          val name = withContext(Dispatchers.IO) {
                              ImageStore.importFromUri(context, uri, state.imageDir)
                          }
                          if (name != null) {
                              state.addImage(id, name)
                          } else {
                              Toast.makeText(context, "Couldn't open that image", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              val tasks = state.tasks
              val scopeTasks = remember(tasks, currentPage, showPending) {
                  if (showPending) tasks else tasks.filter { it.page == currentPage }
              }
              val total = scopeTasks.size
              val doneCount = scopeTasks.count { it.done }
              val visible = remember(scopeTasks, showPending, search) {
                  scopeTasks
                      .filter { (!showPending || !it.done) && it.title.contains(search, ignoreCase = true) }
                      .sortedWith(
                          compareByDescending<TaskItem> { it.pinned }
                              .thenBy { it.done }
                              .thenByDescending { it.id }
                      )
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(MaterialTheme.colorScheme.background)
              ) {
                  Header(
                      greeting = greet,
                      title = if (showPending) "All pending" else currentPage,
                      done = doneCount,
                      total = total,
                      dark = state.dark,
                      onToggleTheme = { state.dark = !state.dark },
                      onToggleSearch = {
                          showSearch = !showSearch
                          if (!showSearch) search = ""
                      }
                  )

                  LazyRow(
                      contentPadding = PaddingValues(horizontal = 16.dp, vertical = 12.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      item(key = "pending-chip") {
                          PageChip(
                              label = "⏳ Pending",
                              selected = showPending,
                              onClick = { showPending = true }
                          )
                      }
                      items(state.pages, key = { it }) { page ->
                          Box {
                              PageChip(
                                  label = page,
                                  selected = !showPending && currentPage == page,
                                  onClick = {
                                      selectedPage = page
                                      showPending = false
                                  },
                                  onLongClick = {
                                      haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                                      menuPage = page
                                  }
                              )
                              DropdownMenu(
                                  expanded = menuPage == page,
                                  onDismissRequest = { menuPage = null }
                              ) {
                                  DropdownMenuItem(
                                      text = { Text("Rename page") },
                                      leadingIcon = { Icon(Icons.Default.Edit, contentDescription = null) },
                                      onClick = {
                                          menuPage = null
                                          renameTarget = page
                                      }
                                  )
                                  if (state.pages.size > 1) {
                                      DropdownMenuItem(
                                          text = { Text("Delete page", color = cs.error) },
                                          leadingIcon = {
                                              Icon(Icons.Default.Delete, contentDescription = null, tint = cs.error)
                                          },
                                          onClick = {
                                              menuPage = null
                                              deleteTarget = page
                                          }
                                      )
                                  }
                              }
                          }
                      }
                      item(key = "new-page-chip") {
                          AssistChip(
                              onClick = { showAddPage = true },
                              label = { Text("+ New page") }
                          )
                      }
                  }

                  if (showSearch) {
                      OutlinedTextField(
                          value = search,
                          onValueChange = { search = it },
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 16.dp),
                          placeholder = { Text("Search tasks…") },
                          leadingIcon = { Icon(Icons.Default.Search, contentDescription = null) },
                          singleLine = true,
                          shape = CircleShape
                      )
                  }

                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(start = 20.dp, end = 8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(
                          text = "${visible.count { !it.done }} pending · ${visible.count { it.done }} done",
                          style = MaterialTheme.typography.labelMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          modifier = Modifier
                              .weight(1f)
                              .padding(vertical = 10.dp)
                      )
                      if (!showPending && doneCount > 0) {
                          TextButton(onClick = { state.clearDone(currentPage) }) { Text("Clear done") }
                      }
                  }

                  Box(
                      modifier = Modifier
                          .weight(1f)
                          .fillMaxWidth()
                  ) {
                      if (visible.isEmpty()) {
                          EmptyState(searching = search.isNotBlank(), pending = showPending)
                      } else {
                          LazyColumn(
                              modifier = Modifier.fillMaxSize(),
                              contentPadding = PaddingValues(start = 16.dp, end = 16.dp, top = 2.dp, bottom = 16.dp),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              items(visible, key = { it.id }) { task ->
                                  TaskRow(
                                      task = task,
                                      showPage = showPending,
                                      accent = pageColor(task.page),
                                      expanded = expandedId == task.id,
                                      imageDir = state.imageDir,
                                      modifier = Modifier.animateItem(),
                                      onToggle = {
                                          if (!task.done) haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                                          state.toggle(task.id)
                                      },
                                      onPin = { state.pin(task.id) },
                                      onExpand = { expandedId = if (expandedId == task.id) -1L else task.id },
                                      onNote = { state.setNote(task.id, it) },
                                      onAddImage = {
                                          pendingImageTask = task.id
                                          picker.launch("image/*")
                                      },
                                      onRemoveImage = { state.removeImage(task.id, it.file) },
                                      onCaption = { img, text -> state.setCaption(task.id, img.file, text) },
                                      onEditImage = { editing = Pair(task.id, it.file) },
                                      onDelete = { state.delete(task.id) }
                                  )
                              }
                          }
                      }
                  }

                  InputBar(onAdd = { state.add(it, currentPage) })
              }

              if (showAddPage) {
                  NameDialog(
                      title = "Create a new page",
                      initial = "",
                      confirmLabel = "Create",
                      onDismiss = { showAddPage = false },
                      onConfirm = { name ->
                          val created = state.addPage(name)
                          if (created != null) {
                              selectedPage = created
                              showPending = false
                              true
                          } else {
                              false
                          }
                      }
                  )
              }

              renameTarget?.let { old ->
                  NameDialog(
                      title = "Rename page",
                      initial = old,
                      confirmLabel = "Save",
                      onDismiss = { renameTarget = null },
                      onConfirm = { name ->
                          val ok = state.renamePage(old, name)
                          if (ok && selectedPage == old) selectedPage = name.trim()
                          ok
                      }
                  )
              }

              deleteTarget?.let { name ->
                  AlertDialog(
                      onDismissRequest = { deleteTarget = null },
                      title = { Text("Delete $name?") },
                      text = { Text("All tasks, notes, and images on this page will be deleted too.") },
                      confirmButton = {
                          TextButton(onClick = {
                              state.deletePage(name)
                              if (selectedPage == name) selectedPage = state.pages.first()
                              deleteTarget = null
                          }) { Text("Delete", color = MaterialTheme.colorScheme.error) }
                      },
                      dismissButton = { TextButton(onClick = { deleteTarget = null }) { Text("Cancel") } }
                  )
              }

              editing?.let { target ->
                  DrawDialog(
                      file = File(state.imageDir, target.second),
                      imageDir = state.imageDir,
                      onDismiss = { editing = null },
                      onSaved = { newName -> state.replaceImage(target.first, target.second, newName) }
                  )
              }
          }

          // ---------- Pieces ----------

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          private fun PageChip(
              label: String,
              selected: Boolean,
              onClick: () -> Unit,
              onLongClick: (() -> Unit)? = null
          ) {
              val cs = MaterialTheme.colorScheme
              val shape = RoundedCornerShape(10.dp)
              Box(
                  modifier = Modifier
                      .clip(shape)
                      .background(if (selected) cs.primaryContainer else cs.surface)
                      .then(if (selected) Modifier else Modifier.border(1.dp, cs.outline, shape))
                      .combinedClickable(onClick = onClick, onLongClick = onLongClick)
                      .padding(horizontal = 14.dp, vertical = 8.dp),
                  contentAlignment = Alignment.Center
              ) {
                  Text(
                      text = label,
                      maxLines = 1,
                      style = MaterialTheme.typography.labelLarge,
                      color = if (selected) cs.onPrimaryContainer else cs.onSurface
                  )
              }
          }

          @Composable
          private fun Header(
              greeting: String,
              title: String,
              done: Int,
              total: Int,
              dark: Boolean,
              onToggleTheme: () -> Unit,
              onToggleSearch: () -> Unit
          ) {
              val progress by animateFloatAsState(
                  targetValue = if (total == 0) 0f else done.toFloat() / total,
                  label = "progress"
              )
              val brush = remember(dark) {
                  Brush.linearGradient(
                      if (dark) listOf(Color(0xFF3A2FA8), Color(0xFF6B3FA0))
                      else listOf(Color(0xFF5B4BDB), Color(0xFF9B59E6))
                  )
              }
              val subtitle = when {
                  total == 0 -> "No tasks yet. Let's start ✨"
                  done == total -> "All done! 🎉"
                  else -> "$done of $total done"
              }

              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(bottomStart = 32.dp, bottomEnd = 32.dp))
                      .background(brush)
                      .statusBarsPadding()
                      .padding(start = 20.dp, end = 8.dp, top = 12.dp, bottom = 20.dp)
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              text = greeting,
                              style = MaterialTheme.typography.bodyMedium,
                              color = Color.White.copy(alpha = 0.8f)
                          )
                          Text(
                              text = title,
                              style = MaterialTheme.typography.headlineMedium,
                              fontWeight = FontWeight.Bold,
                              color = Color.White,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      IconButton(onClick = onToggleSearch) {
                          Icon(Icons.Default.Search, contentDescription = "Search", tint = Color.White)
                      }
                      IconButton(onClick = onToggleTheme) {
                          Icon(
                              imageVector = if (dark) Icons.Default.LightMode else Icons.Default.DarkMode,
                              contentDescription = "Switch theme",
                              tint = Color.White
                          )
                      }
                  }
                  Spacer(Modifier.height(14.dp))
                  Column(modifier = Modifier.padding(end = 12.dp)) {
                      Text(
                          text = subtitle,
                          style = MaterialTheme.typography.labelLarge,
                          color = Color.White
                      )
                      Spacer(Modifier.height(8.dp))
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(8.dp)
                              .clip(CircleShape)
                              .background(Color.White.copy(alpha = 0.25f))
                      ) {
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth(progress)
                                  .fillMaxHeight()
                                  .clip(CircleShape)
                                  .background(Color.White)
                          )
                      }
                  }
              }
          }

          @Composable
          private fun TaskRow(
              task: TaskItem,
              showPage: Boolean,
              accent: Color,
              expanded: Boolean,
              imageDir: File,
              modifier: Modifier,
              onToggle: () -> Unit,
              onPin: () -> Unit,
              onExpand: () -> Unit,
              onNote: (String) -> Unit,
              onAddImage: () -> Unit,
              onRemoveImage: (NoteImage) -> Unit,
              onCaption: (NoteImage, String) -> Unit,
              onEditImage: (NoteImage) -> Unit,
              onDelete: () -> Unit
          ) {
              val cs = MaterialTheme.colorScheme
              val checkBg by animateColorAsState(
                  targetValue = if (task.done) accent else Color.Transparent,
                  label = "check"
              )
              val textAlpha by animateFloatAsState(
                  targetValue = if (task.done) 0.5f else 1f,
                  label = "textAlpha"
              )
              var confirmDeleteTask by remember { mutableStateOf(false) }
              var imageToRemove by remember { mutableStateOf<NoteImage?>(null) }
              val hasContent = task.note.isNotBlank() || task.images.isNotEmpty()

              Surface(
                  modifier = modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(20.dp),
                  color = cs.surface
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .animateContentSize()
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(
                              modifier = Modifier
                                  .padding(start = 4.dp)
                                  .size(48.dp)
                                  .clip(CircleShape)
                                  .clickable(onClick = onToggle),
                              contentAlignment = Alignment.Center
                          ) {
                              Box(
                                  modifier = Modifier
                                      .size(26.dp)
                                      .clip(CircleShape)
                                      .background(checkBg)
                                      .border(2.dp, accent, CircleShape),
                                  contentAlignment = Alignment.Center
                              ) {
                                  if (task.done) {
                                      Icon(
                                          imageVector = Icons.Default.Check,
                                          contentDescription = null,
                                          tint = Color.White,
                                          modifier = Modifier.size(16.dp)
                                      )
                                  }
                              }
                          }
                          Column(
                              modifier = Modifier
                                  .weight(1f)
                                  .clickable(onClick = onExpand)
                                  .padding(horizontal = 4.dp, vertical = 14.dp)
                          ) {
                              Text(
                                  text = task.title,
                                  style = MaterialTheme.typography.bodyLarge,
                                  fontWeight = if (task.pinned) FontWeight.SemiBold else FontWeight.Normal,
                                  textDecoration = if (task.done) TextDecoration.LineThrough else TextDecoration.None,
                                  modifier = Modifier.alpha(textAlpha)
                              )
                              if (showPage) {
                                  Text(
                                      text = task.page,
                                      style = MaterialTheme.typography.labelSmall,
                                      color = accent
                                  )
                              }
                          }
                          if (hasContent) {
                              Icon(
                                  imageVector = Icons.Default.Description,
                                  contentDescription = "Has note",
                                  tint = cs.primary,
                                  modifier = Modifier
                                      .padding(horizontal = 4.dp)
                                      .size(20.dp)
                              )
                          }
                          IconButton(onClick = onPin) {
                              Icon(
                                  imageVector = Icons.Default.PushPin,
                                  contentDescription = "Pin task",
                                  tint = if (task.pinned) accent else cs.onSurfaceVariant.copy(alpha = 0.45f)
                              )
                          }
                          IconButton(onClick = onExpand) {
                              Icon(
                                  imageVector = if (expanded) Icons.Default.KeyboardArrowUp else Icons.Default.KeyboardArrowDown,
                                  contentDescription = if (expanded) "Collapse" else "Expand",
                                  tint = cs.onSurfaceVariant
                              )
                          }
                      }

                      if (expanded) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(start = 16.dp, end = 16.dp, bottom = 14.dp)
                          ) {
                              Text(
                                  text = "Note",
                                  style = MaterialTheme.typography.labelMedium,
                                  color = cs.onSurfaceVariant
                              )
                              Spacer(Modifier.height(4.dp))
                              NoteField(
                                  initial = task.note,
                                  placeholder = "Write a note…",
                                  minHeight = 72.dp,
                                  fontSize = 14.sp,
                                  onChange = onNote
                              )
                              Spacer(Modifier.height(14.dp))
                              Text(
                                  text = "Images",
                                  style = MaterialTheme.typography.labelMedium,
                                  color = cs.onSurfaceVariant
                              )
                              Spacer(Modifier.height(6.dp))
                              task.images.chunked(2).forEach { rowItems ->
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      rowItems.forEach { img ->
                                          key(img.file) {
                                              ImageCard(
                                                  modifier = Modifier.weight(1f),
                                                  file = File(imageDir, img.file),
                                                  caption = img.caption,
                                                  onRemove = { imageToRemove = img },
                                                  onEdit = { onEditImage(img) },
                                                  onCaption = { onCaption(img, it) }
                                              )
                                          }
                                      }
                                      if (rowItems.size == 1) Spacer(Modifier.weight(1f))
                                  }
                                  Spacer(Modifier.height(8.dp))
                              }
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  FilledTonalButton(onClick = onAddImage) {
                                      Icon(Icons.Default.AddPhotoAlternate, contentDescription = null, modifier = Modifier.size(18.dp))
                                      Spacer(Modifier.width(6.dp))
                                      Text("Add image")
                                  }
                                  Spacer(Modifier.weight(1f))
                                  TextButton(onClick = { confirmDeleteTask = true }) {
                                      Icon(
                                          Icons.Default.Delete,
                                          contentDescription = null,
                                          tint = cs.error,
                                          modifier = Modifier.size(18.dp)
                                      )
                                      Spacer(Modifier.width(4.dp))
                                      Text("Delete task", color = cs.error)
                                  }
                              }
                              Spacer(Modifier.height(4.dp))
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Icon(
                                      Icons.Default.Check,
                                      contentDescription = null,
                                      tint = cs.onSurfaceVariant,
                                      modifier = Modifier.size(14.dp)
                                  )
                                  Spacer(Modifier.width(4.dp))
                                  Text(
                                      text = "Saved automatically",
                                      style = MaterialTheme.typography.labelSmall,
                                      color = cs.onSurfaceVariant
                                  )
                              }
                          }
                      }
                  }
              }

              if (confirmDeleteTask) {
                  AlertDialog(
                      onDismissRequest = { confirmDeleteTask = false },
                      title = { Text("Delete this task?") },
                      text = { Text("Its note and images will be deleted too.") },
                      confirmButton = {
                          TextButton(onClick = {
                              confirmDeleteTask = false
                              onDelete()
                          }) { Text("Delete", color = MaterialTheme.colorScheme.error) }
                      },
                      dismissButton = { TextButton(onClick = { confirmDeleteTask = false }) { Text("Cancel") } }
                  )
              }

              imageToRemove?.let { img ->
                  AlertDialog(
                      onDismissRequest = { imageToRemove = null },
                      title = { Text("Remove this image?") },
                      text = { Text("The image and its caption will be deleted.") },
                      confirmButton = {
                          TextButton(onClick = {
                              imageToRemove = null
                              onRemoveImage(img)
                          }) { Text("Remove", color = MaterialTheme.colorScheme.error) }
                      },
                      dismissButton = { TextButton(onClick = { imageToRemove = null }) { Text("Cancel") } }
                  )
              }
          }

          @Composable
          private fun NoteField(
              initial: String,
              placeholder: String,
              minHeight: Dp,
              fontSize: androidx.compose.ui.unit.TextUnit,
              onChange: (String) -> Unit
          ) {
              val cs = MaterialTheme.colorScheme
              var text by remember { mutableStateOf(initial) }
              BasicTextField(
                  value = text,
                  onValueChange = {
                      text = it
                      onChange(it)
                  },
                  textStyle = TextStyle(color = cs.onSurface, fontSize = fontSize),
                  cursorBrush = SolidColor(cs.primary),
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(10.dp))
                      .background(cs.surfaceVariant)
                      .heightIn(min = minHeight)
                      .padding(horizontal = 10.dp, vertical = 8.dp),
                  decorationBox = { inner ->
                      Box {
                          if (text.isEmpty()) {
                              Text(
                                  text = placeholder,
                                  color = cs.onSurfaceVariant.copy(alpha = 0.7f),
                                  fontSize = fontSize
                              )
                          }
                          inner()
                      }
                  }
              )
          }

          @Composable
          private fun ImageCard(
              modifier: Modifier,
              file: File,
              caption: String,
              onRemove: () -> Unit,
              onEdit: () -> Unit,
              onCaption: (String) -> Unit
          ) {
              val cs = MaterialTheme.colorScheme
              val bitmap by produceState<ImageBitmap?>(null, file.path) {
                  value = withContext(Dispatchers.IO) { ImageStore.loadBitmap(file, 700)?.asImageBitmap() }
              }
              Column(modifier = modifier) {
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(110.dp)
                          .clip(RoundedCornerShape(12.dp))
                          .background(cs.surfaceVariant)
                          .clickable(onClick = onEdit)
                  ) {
                      val bmp = bitmap
                      if (bmp != null) {
                          Image(
                              bitmap = bmp,
                              contentDescription = "Attached image",
                              contentScale = ContentScale.Crop,
                              modifier = Modifier.fillMaxSize()
                          )
                      }
                      Box(
                          modifier = Modifier
                              .align(Alignment.TopStart)
                              .padding(4.dp)
                              .size(26.dp)
                              .clip(CircleShape)
                              .background(Color.Black.copy(alpha = 0.55f))
                              .clickable(onClick = onEdit),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              Icons.Default.Edit,
                              contentDescription = "Draw on image",
                              tint = Color.White,
                              modifier = Modifier.size(14.dp)
                          )
                      }
                      Box(
                          modifier = Modifier
                              .align(Alignment.TopEnd)
                              .padding(4.dp)
                              .size(26.dp)
                              .clip(CircleShape)
                              .background(Color.Black.copy(alpha = 0.55f))
                              .clickable(onClick = onRemove),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              Icons.Default.Close,
                              contentDescription = "Remove image",
                              tint = Color.White,
                              modifier = Modifier.size(14.dp)
                          )
                      }
                  }
                  Spacer(Modifier.height(4.dp))
                  NoteField(
                      initial = caption,
                      placeholder = "Add a note…",
                      minHeight = 32.dp,
                      fontSize = 12.sp,
                      onChange = onCaption
                  )
              }
          }

          private class Scribble(val color: Color) {
              val points = mutableStateListOf<Offset>()
          }

          @Composable
          private fun DrawDialog(
              file: File,
              imageDir: File,
              onDismiss: () -> Unit,
              onSaved: (String) -> Unit
          ) {
              val scope = rememberCoroutineScope()
              val bitmap by produceState<Bitmap?>(null, file.path) {
                  value = withContext(Dispatchers.IO) { ImageStore.loadBitmap(file, ImageStore.MAX_DIM) }
              }
              val strokes = remember { mutableStateListOf<Scribble>() }
              var color by remember { mutableStateOf(PenColors[0]) }
              var saving by remember { mutableStateOf(false) }
              val penColor by rememberUpdatedState(color)

              Dialog(
                  onDismissRequest = onDismiss,
                  properties = DialogProperties(usePlatformDefaultWidth = false)
              ) {
                  Surface(
                      modifier = Modifier.fillMaxSize(),
                      color = Color(0xFF101014)
                  ) {
                      Column(modifier = Modifier.fillMaxSize()) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 4.dp, vertical = 4.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              IconButton(onClick = onDismiss) {
                                  Icon(Icons.Default.Close, contentDescription = "Close", tint = Color.White)
                              }
                              Spacer(Modifier.weight(1f))
                              TextButton(onClick = {
                                  if (strokes.isNotEmpty()) strokes.removeAt(strokes.lastIndex)
                              }) { Text("Undo", color = Color.White) }
                              TextButton(onClick = { strokes.clear() }) { Text("Clear", color = Color.White) }
                              TextButton(
                                  enabled = !saving,
                                  onClick = {
                                      if (strokes.isEmpty()) {
                                          onDismiss()
                                      } else {
                                          saving = true
                                          val snapshot = strokes.map { Pair(it.color.toArgb(), it.points.toList()) }
                                          scope.launch {
                                              val name = withContext(Dispatchers.IO) {
                                                  ImageStore.saveWithStrokes(file, imageDir, snapshot, PEN_WIDTH)
                                              }
                                              if (name != null) onSaved(name)
                                              onDismiss()
                                          }
                                      }
                                  }
                              ) { Text("Save", color = Color(0xFF9C8CFF), fontWeight = FontWeight.Bold) }
                          }

                          Box(
                              modifier = Modifier
                                  .weight(1f)
                                  .fillMaxWidth()
                                  .padding(horizontal = 8.dp),
                              contentAlignment = Alignment.Center
                          ) {
                              val bmp = bitmap
                              if (bmp == null) {
                                  Text("Loading…", color = Color.White)
                              } else {
                                  val shown = remember(bmp) { bmp.asImageBitmap() }
                                  Box(
                                      modifier = Modifier
                                          .aspectRatio(bmp.width.toFloat() / bmp.height.toFloat())
                                          .background(Color.White)
                                  ) {
                                      Image(
                                          bitmap = shown,
                                          contentDescription = null,
                                          contentScale = ContentScale.FillBounds,
                                          modifier = Modifier.fillMaxSize()
                                      )
                                      Canvas(
                                          modifier = Modifier
                                              .fillMaxSize()
                                              .pointerInput(Unit) {
                                                  detectDragGestures(
                                                      onDragStart = { o ->
                                                          val s = Scribble(penColor)
                                                          s.points.add(
                                                              Offset(
                                                                  (o.x / size.width).coerceIn(0f, 1f),
                                                                  (o.y / size.height).coerceIn(0f, 1f)
                                                              )
                                                          )
                                                          strokes.add(s)
                                                      },
                                                      onDrag = { change, _ ->
                                                          change.consume()
                                                          val p = change.position
                                                          strokes.lastOrNull()?.points?.add(
                                                              Offset(
                                                                  (p.x / size.width).coerceIn(0f, 1f),
                                                                  (p.y / size.height).coerceIn(0f, 1f)
                                                              )
                                                          )
                                                      }
                                                  )
                                              }
                                      ) {
                                          for (s in strokes) {
                                              val pts = s.points
                                              if (pts.isEmpty()) continue
                                              if (pts.size == 1) {
                                                  drawCircle(
                                                      color = s.color,
                                                      radius = PEN_WIDTH * size.width / 2f,
                                                      center = Offset(pts[0].x * size.width, pts[0].y * size.height)
                                                  )
                                              } else {
                                                  val path = Path()
                                                  path.moveTo(pts[0].x * size.width, pts[0].y * size.height)
                                                  for (i in 1 until pts.size) {
                                                      path.lineTo(pts[i].x * size.width, pts[i].y * size.height)
                                                  }
                                                  drawPath(
                                                      path = path,
                                                      color = s.color,
                                                      style = Stroke(
                                                          width = PEN_WIDTH * size.width,
                                                          cap = StrokeCap.Round,
                                                          join = StrokeJoin.Round
                                                      )
                                                  )
                                              }
                                          }
                                      }
                                  }
                              }
                          }

                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 16.dp),
                              horizontalArrangement = Arrangement.Center,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              PenColors.forEach { c ->
                                  Box(
                                      modifier = Modifier
                                          .padding(horizontal = 8.dp)
                                          .size(36.dp)
                                          .clip(CircleShape)
                                          .background(c)
                                          .then(
                                              if (c == color) Modifier.border(3.dp, Color(0xFF9C8CFF), CircleShape)
                                              else Modifier.border(1.dp, Color.White.copy(alpha = 0.4f), CircleShape)
                                          )
                                          .clickable { color = c }
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun EmptyState(searching: Boolean, pending: Boolean) {
              val emoji: String
              val title: String
              val hint: String
              when {
                  searching -> {
                      emoji = "🔍"; title = "No matches"; hint = "Try a different word"
                  }
                  pending -> {
                      emoji = "🎉"; title = "Nothing pending"; hint = "You're all caught up"
                  }
                  else -> {
                      emoji = "✨"; title = "A fresh page"; hint = "Add your first task below"
                  }
              }
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(32.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text(text = emoji, fontSize = 56.sp)
                  Spacer(Modifier.height(12.dp))
                  Text(
                      text = title,
                      style = MaterialTheme.typography.titleMedium,
                      fontWeight = FontWeight.Bold
                  )
                  Spacer(Modifier.height(4.dp))
                  Text(
                      text = hint,
                      style = MaterialTheme.typography.bodyMedium,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      textAlign = TextAlign.Center
                  )
              }
          }

          @Composable
          private fun InputBar(onAdd: (String) -> Unit) {
              var text by remember { mutableStateOf("") }
              fun submit() {
                  if (text.isNotBlank()) {
                      onAdd(text)
                      text = ""
                  }
              }
              Surface(
                  color = MaterialTheme.colorScheme.surface,
                  shadowElevation = 8.dp
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .navigationBarsPadding()
                          .imePadding()
                          .padding(12.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      OutlinedTextField(
                          value = text,
                          onValueChange = { text = it },
                          modifier = Modifier.weight(1f),
                          placeholder = { Text("Add a task…") },
                          singleLine = true,
                          shape = CircleShape,
                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Done),
                          keyboardActions = KeyboardActions(onDone = { submit() })
                      )
                      FilledIconButton(
                          onClick = { submit() },
                          modifier = Modifier.size(52.dp)
                      ) {
                          Icon(Icons.Default.ArrowUpward, contentDescription = "Add task")
                      }
                  }
              }
          }

          @Composable
          private fun NameDialog(
              title: String,
              initial: String,
              confirmLabel: String,
              onDismiss: () -> Unit,
              onConfirm: (String) -> Boolean
          ) {
              var name by remember { mutableStateOf(initial) }
              var error by remember { mutableStateOf(false) }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = {
                      OutlinedTextField(
                          value = name,
                          onValueChange = {
                              name = it
                              error = false
                          },
                          label = { Text("Page name") },
                          singleLine = true,
                          isError = error,
                          supportingText = { if (error) Text("Pick a name that isn't empty or already used") }
                      )
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          if (onConfirm(name)) onDismiss() else error = true
                      }) { Text(confirmLabel) }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Cancel") } }
              )
          }

          // ---------- Storage helpers ----------

          private fun loadTasks(raw: String): List<TaskItem> = try {
              val array = JSONArray(raw)
              (0 until array.length()).map { i ->
                  val o = array.getJSONObject(i)
                  val imgArray = o.optJSONArray("images")
                  val imgs = if (imgArray == null) {
                      emptyList()
                  } else {
                      (0 until imgArray.length()).map { j ->
                          val io = imgArray.getJSONObject(j)
                          NoteImage(file = io.optString("file"), caption = io.optString("caption"))
                      }
                  }
                  TaskItem(
                      id = o.optLong("id", i.toLong()),
                      title = o.optString("title"),
                      page = o.optString("page", "My Tasks"),
                      done = o.optBoolean("done"),
                      pinned = o.optBoolean("pinned"),
                      note = o.optString("note", ""),
                      images = imgs
                  )
              }
          } catch (_: Exception) {
              emptyList()
          }

          private fun tasksToJson(tasks: List<TaskItem>): String {
              val array = JSONArray()
              tasks.forEach { task ->
                  val imgs = JSONArray()
                  task.images.forEach { img ->
                      imgs.put(JSONObject().apply {
                          put("file", img.file)
                          put("caption", img.caption)
                      })
                  }
                  array.put(JSONObject().apply {
                      put("id", task.id)
                      put("title", task.title)
                      put("page", task.page)
                      put("done", task.done)
                      put("pinned", task.pinned)
                      put("note", task.note)
                      put("images", imgs)
                  })
              }
              return array.toString()
          }

          private fun loadPages(raw: String): List<String> = try {
              val array = JSONArray(raw)
              (0 until array.length()).map { array.getString(it) }.ifEmpty { listOf("My Tasks") }
          } catch (_: Exception) {
              listOf("My Tasks")
          }

          private fun pagesToJson(pages: List<String>): String {
              val array = JSONArray()
              pages.forEach { array.put(it) }
              return array.toString()
          }
          EOF_FILE
          echo Project files created

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build APK (fast release build, falls back to debug)
        run: |
          mkdir -p out
          if gradle --no-daemon assembleRelease; then
            cp app/build/outputs/apk/release/app-release.apk out/MyTaskManager.apk
          else
            echo "Release build failed, building debug instead"
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk out/MyTaskManager.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTaskManager-apk
          path: out/MyTaskManager.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/MyTaskManager.apk --title "Task Manager by Bhuvan" --notes "Download MyTaskManager.apk and install it on your phone."
