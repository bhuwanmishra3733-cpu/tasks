          mkdir -p app/src/main/java/com/example/mytaskmanager app/src/main/res/drawable app/src/main/res/mipmap-anydpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values app/src/main/res/values-night
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          kotlin.code.style=official
          kotlin.jvm.target.validation.mode=warning
          EOF_FILE
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyTaskManager"
          include(":app")
          EOF_FILE
